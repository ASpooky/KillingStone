<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KillingStone</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="page">
      <header class="page-header">
        <h1>KillingStone</h1>
        <p class="subtitle">画像にファイルをこっそり埋め込む・取り出す</p>
      </header>

      <div class="mode-switch" role="tablist">
        <button type="button" class="mode-button is-active" data-mode="encode" role="tab" aria-selected="true">
          Encode
        </button>
        <button type="button" class="mode-button" data-mode="decode" role="tab" aria-selected="false">
          Decode
        </button>
      </div>

      <section id="encode-panel" class="panel">
        <div class="field">
          <label for="carrier-image">キャリア画像</label>
          <input type="file" id="carrier-image" accept="image/*" />
        </div>

        <div class="field">
          <label for="payload-files">埋め込むファイル</label>
          <input type="file" id="payload-files" multiple />
        </div>

        <div class="field">
          <label for="bits-per-channel">1channelあたりのbit数: <span id="bits-per-channel-value">1</span></label>
          <input type="range" id="bits-per-channel" min="1" max="8" value="1" />
        </div>

        <button type="button" id="encode-button" class="primary-button">Encode</button>
        <p id="encode-error" class="error-message" hidden></p>

        <div id="encode-result" class="result-card" hidden>
          <canvas id="encode-preview"></canvas>
          <a id="encode-download" class="primary-button" download="stego.png">画像を保存</a>
        </div>
      </section>

      <section id="decode-panel" class="panel" hidden>
        <div class="field">
          <label for="stego-image">画像を選択</label>
          <input type="file" id="stego-image" accept="image/*" />
        </div>

        <button type="button" id="decode-button" class="primary-button">Decode</button>
        <p id="decode-error" class="error-message" hidden></p>

        <ul id="decoded-files" class="file-list" hidden></ul>
        <button type="button" id="save-selected-button" class="primary-button" hidden>選択したファイルを保存</button>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
